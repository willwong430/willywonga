<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quality of Thought</title>
  <meta name="description" content="One quote a day to improve the quality of your thinking.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <p class="date" id="date"></p>
    <blockquote>
      <p id="quote">&nbsp;</p>
      <footer id="author"></footer>
    </blockquote>
  </main>
  <footer class="site"><span>qualityofthought.com</span> &middot; a new quote every day</footer>
  <noscript><p style="text-align:center">Please enable JavaScript to see today's quote.</p></noscript>
  <script src="app.js"></script>
</body>
</html>
